name: UI Package E2E
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  HOLOGRAM_START: '1'
jobs:
  consumer:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - uses: actions/cache@v6
        with:
          path: deps
          key: ${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-glibc-precompiled-elixir1.18-otp28-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs') }}
      - name: Install pinned dependencies
        run: |
          mix deps.get --check-locked
          elixir scripts/check-toolchain.exs
          mix npm.ci
      - env:
          MIX_ENV: prod
        run: |
          scripts/with-precompiled-toolchain.sh mix prepublish
          elixir .github/scripts/ui_package.exs stage "$RUNNER_TEMP/ui-package"
          elixir .github/scripts/ui_package.exs smoke "$RUNNER_TEMP/ui-package"
          bundler_version=$(elixir -r .github/scripts/release_support.exs -e 'IO.write(ReleaseSupport.bundler_version!())')
          elixir .github/scripts/runtime_consumer.exs "$bundler_version"
