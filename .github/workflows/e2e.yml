name: UI Package E2E
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v6
        with:
          path: deps
          key: ${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-glibc-precompiled-elixir1.18-otp28-${{ hashFiles('mix.lock', 'BUNDLER_VERSION') }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ github.repository }}-bun1.3.13-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Install pinned dependencies
        run: |
          mix deps.get --check-locked
          elixir scripts/check-toolchain.exs
          bun install --frozen-lockfile
      - env:
          MIX_ENV: prod
        run: |
          scripts/with-precompiled-toolchain.sh mix prepublish
          elixir .github/scripts/ui_package.exs stage "$RUNNER_TEMP/ui-package"
          elixir .github/scripts/ui_package.exs smoke "$RUNNER_TEMP/ui-package"
          elixir .github/scripts/runtime_consumer.exs "$(cat BUNDLER_VERSION)"
