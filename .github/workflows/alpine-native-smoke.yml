name: UI Alpine Consumer
on:
  workflow_call:
    inputs:
      version:
        description: UI version U
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published UI version U
        required: true
        type: string
permissions:
  contents: read
jobs:
  alpine-consumer:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - name: Registry consumer with independent U and B
        env:
          UI_VERSION: ${{ inputs.version }}
        run: |
          bundler_version=$(elixir -r .github/scripts/release_support.exs -e 'IO.write(ReleaseSupport.bundler_version!())')
          cp mix.lock .github/scripts/mix.lock
          trap 'rm -f .github/scripts/mix.lock' EXIT
          docker run --rm --volume "$PWD/.github/scripts:/validation:ro" \
            --env REQUIRE_MUSL=1 elixir:1.18-otp-28-alpine \
            sh /validation/alpine_native_smoke.sh "$bundler_version" "$UI_VERSION"
