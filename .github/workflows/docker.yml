name: Docker

on:
  workflow_dispatch:
    inputs:
      git-ref:
        description: 'Git revision to build (branch, tag, or commit)'
        required: true
        default: 'main'
        type: string
      version:
        description: 'Image version tag (e.g., 9.0.0).'
        required: true
        default: "9.0.0"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-demo:
    name: Build Demo Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Determine version tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.event.inputs.git-ref }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          LATEST_RELEASE="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          {
            echo 'tags<<EOF'
            echo "docker.io/gsmlg/duskmoon-storybook:${VERSION}"
            echo "ghcr.io/duskmoon-dev/duskmoon-storybook:${VERSION}"
            if [ "v${VERSION}" = "$LATEST_RELEASE" ]; then
              echo "docker.io/gsmlg/duskmoon-storybook:latest"
              echo "ghcr.io/duskmoon-dev/duskmoon-storybook:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
