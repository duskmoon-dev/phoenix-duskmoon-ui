name: UI Test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: UI browser and component tests / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28']
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: ${{ matrix.otp }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install pinned dependencies
        run: |
          mix deps.get --check-locked
          elixir scripts/check-toolchain.exs
          bun install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Browser and component regressions
        env:
          MIX_ENV: test
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: scripts/with-precompiled-toolchain.sh mix test
