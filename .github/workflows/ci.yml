name: UI CI
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  DUSKMOON_NATIVE_INVOCATION_LOG: /tmp/duskmoon-native-invocations.log
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    name: UI compile, assets, hooks and release contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v6
        with:
          path: deps
          key: ${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-glibc-precompiled-elixir1.18-otp28-${{ hashFiles('mix.lock', 'BUNDLER_VERSION') }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ github.repository }}-bun1.3.13-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Install pinned dependencies
        run: |
          mix deps.get --check-locked
          elixir scripts/check-toolchain.exs
          bun install --frozen-lockfile
      - run: elixir .github/scripts/release_test.exs
      - run: elixir scripts/native-policy-test.exs
      - run: elixir scripts/prepare-candidate-test.exs
      - run: scripts/with-precompiled-toolchain.sh mix format --check-formatted
      - run: scripts/with-precompiled-toolchain.sh mix compile --warnings-as-errors
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Hooks, forms and chat browser regressions
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: bun test --cwd apps/phoenix_duskmoon
      - name: Production JS, CSS, icons and Storybook release
        env:
          MIX_ENV: prod
        run: |
          scripts/with-precompiled-toolchain.sh mix prepublish
          scripts/with-precompiled-toolchain.sh mix duskmoon_bundler.build duskmoon_storybook
          scripts/with-precompiled-toolchain.sh mix phx.digest
          scripts/with-precompiled-toolchain.sh mix release storybook
          elixir scripts/check-release-applications.exs _build/prod/rel/storybook
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-native-invocations
          path: /tmp/duskmoon-native-invocations.log
          if-no-files-found: ignore
